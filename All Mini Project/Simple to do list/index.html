<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do List Demo</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f7f7f7;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      .todo-container {
        background: #ffffff;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 400px;
      }

      .todo-header {
        text-align: center;
        margin-bottom: 20px;
      }

      .todo-header h1 {
        margin: 0;
        font-size: 1.5rem;
        color: #333;
      }

      .todo-input {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
      }

      .todo-input input {
        flex: 1;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
        font-size: 1rem;
      }

      .todo-input button {
        padding: 10px 15px;
        background-color: #007bff;
        color: #ffffff;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 1rem;
      }

      .todo-input button:hover {
        background-color: #0056b3;
      }

      .todo-list {
        list-style: none;
        padding: 0;
        margin: 0;
      }

      .todo-list li {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #f9f9f9;
        padding: 10px;
        margin-bottom: 10px;
        border: 1px solid #ddd;
        border-radius: 5px;
      }

      .todo-list li span {
        flex: 1;
      }

      .todo-list li button {
        background: #ff4d4d;
        color: white;
        border: none;
        border-radius: 5px;
        padding: 5px 10px;
        cursor: pointer;
      }

      .todo-list li button:hover {
        background: #cc0000;
      }
    </style>
  </head>
  <body>
    <div class="todo-container">
      <div class="todo-header">
        <h1>To-Do List</h1>
      </div>
      <div class="todo-input">
        <input type="text" id="todoInput" placeholder="Add a new task..." />
        <button onclick="addTodo()">Add</button>
      </div>
      <ul class="todo-list" id="todoList">
        <!-- To-Do items will appear here -->
        <li>
          BUY EGGS
          <button>Delete</button>
        </li>

        <li>
          BUY FRUIT
          <button>Delete</button>
        </li>
        <li>
          BUY MEET
          <button>Delete</button>
        </li>
        <li>
          BUY ONION
          <button>Delete</button>
        </li>
      </ul>
    </div>
  </body>
</html>
